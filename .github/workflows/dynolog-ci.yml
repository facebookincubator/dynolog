name: DYNOLOGCI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        # TODO: add otel once third_party/opentelemetry-cpp is a real submodule
        # on GitHub (it is a placeholder file today).
        exporter: [none, otlp]
    name: Build and test (${{ matrix.os }}, exporter=${{ matrix.exporter }})

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential cmake ninja-build pkg-config \
          libssl-dev libcurl4-openssl-dev libprotobuf-dev protobuf-compiler
        c++ --version
        cmake --version

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Build dynolog
      run: |
        set -e
        BUILD_OTLP=${{ matrix.exporter == 'otlp' && 1 || 0 }} ./scripts/build.sh

    - name: Run unit tests
      run: |
        set -e
        cd "$GITHUB_WORKSPACE/build"
        ctest --output-on-failure

  # The oldest compilers the build supports (CMakeLists.txt): GCC 11.3 and
  # Clang 16. Ubuntu 22.04 ships GCC 11.4; Ubuntu 24.04 ships Clang 16.
  compiler-floor:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-11
            container: ubuntu:22.04
            packages: build-essential
            cc: gcc
            cxx: g++
          - name: clang-16
            container: ubuntu:24.04
            packages: build-essential clang-16
            cc: clang-16
            cxx: clang++-16
    container: ${{ matrix.container }}
    name: Build and test (${{ matrix.name }})

    steps:
    - name: Install dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        apt-get update
        apt-get install -y --no-install-recommends \
          ca-certificates git cmake ninja-build pkg-config libssl-dev \
          ${{ matrix.packages }}

    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build dynolog
      env:
        CC: ${{ matrix.cc }}
        CXX: ${{ matrix.cxx }}
      run: |
        set -e
        "$CXX" --version
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCARGO=/bin/true
        cmake --build build

    - name: Run unit tests
      run: |
        set -e
        cd build
        ctest --output-on-failure
